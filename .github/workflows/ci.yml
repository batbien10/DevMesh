name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Test, benchmark and build
        run: ./gradlew test engineeringValidation shadowJar

      - name: Verify reproducible benchmark outputs
        run: git diff --exit-code -- benchmarks/engineering-validation.md benchmarks/results/engineering-validation.json
