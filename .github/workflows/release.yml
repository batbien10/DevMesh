name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    name: Build ${{ matrix.platform }} runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            archive: devmesh-jdk21-linux-x64.tar.gz
          - platform: windows-x64
            os: windows-2022
            archive: devmesh-jdk21-windows-x64.zip
          - platform: macos-x64
            os: macos-13
            archive: devmesh-jdk21-macos-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Test and build JAR on Unix
        if: runner.os != 'Windows'
        run: ./gradlew test shadowJar

      - name: Test and build JAR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat test shadowJar

      - name: Build Linux/macOS Java 21 runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf release-runtime release-bundle
          jlink \
            --add-modules java.base,java.compiler,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.security.jgss,java.sql,jdk.unsupported \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=2 \
            --output release-runtime
          mkdir -p release-bundle/bin release-bundle/runtime
          cp build/libs/devmesh.jar release-bundle/devmesh.jar
          cp bin/devmesh bin/devmesh.ps1 release-bundle/bin/
          cp -R release-runtime/. release-bundle/runtime/
          chmod +x release-bundle/bin/devmesh
          tar -czf "${{ matrix.archive }}" -C release-bundle .

      - name: Build Windows Java 21 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path release-runtime) { Remove-Item release-runtime -Recurse -Force }
          if (Test-Path release-bundle) { Remove-Item release-bundle -Recurse -Force }
          jlink.exe `
            --add-modules java.base,java.compiler,java.desktop,java.instrument,java.management,java.naming,java.net.http,java.security.jgss,java.sql,jdk.unsupported `
            --strip-debug `
            --no-man-pages `
            --no-header-files `
            --compress=2 `
            --output release-runtime
          New-Item -ItemType Directory -Force -Path release-bundle\bin, release-bundle\runtime | Out-Null
          Copy-Item build\libs\devmesh.jar release-bundle\devmesh.jar
          Copy-Item bin\devmesh.bat, bin\devmesh.ps1 release-bundle\bin\
          Copy-Item release-runtime\* release-bundle\runtime\ -Recurse
          Compress-Archive -Path release-bundle\* -DestinationPath "${{ matrix.archive }}"

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.archive }}

      - name: Upload JAR
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: devmesh-jar
          path: build/libs/devmesh.jar

  release:
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ -f "${notes_file}" ]; then
              gh release edit "${GITHUB_REF_NAME}" --title "DevMesh ${GITHUB_REF_NAME}" --notes-file "${notes_file}"
            fi
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          elif [ -f "${notes_file}" ]; then
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "DevMesh ${GITHUB_REF_NAME}" --notes-file "${notes_file}"
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* --title "DevMesh ${GITHUB_REF_NAME}" --generate-notes
          fi
